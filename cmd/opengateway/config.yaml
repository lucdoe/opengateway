# Server and Store can be left out; the values below are the defaults.
# Environment variables override this file: PORT, STORE_TYPE, REDIS_HOST,
# REDIS_PORT, REDIS_PASSWORD and JWT_SECRET (for Plugins.JWTConfig.SecretKey).
Server:
  Port: 4000
  ReadHeaderTimeout: 10s # time a client has to send its request headers
  IdleTimeout: 120s # how long an idle keep-alive connection stays open
  ShutdownTimeout: 15s # time requests in flight get to finish on shutdown
  UpstreamTimeout: 30s # time an upstream has to start answering

# Where the cache and rate-limit plugins keep their state.
Store:
  Type: "memory" # memory: in the gateway, per instance. redis: shared by all instances
  Redis: # only read when Type is redis; needs Redis 7.0+ or a compatible server
    Host: "localhost"
    Port: 6379
    Password: ""

Plugins:
  LoggerConfig:
    FilePath: "" # empty: JSON lines to stdout; or a file to append to, such as "server.log"
  JWTConfig:
    SecretKey: "your-256-bit-secret"
    SigningMethod: "HS256"
    Issuer: "ExampleIssuer" # checked when set
    Audience: "ExampleAudience" # checked when set
    Scope: "" # scopes every token needs, space-separated; endpoints can add more with Auth.Scope
  RateLimitConfig:
    Limit: 100
    Window: 1m
  CORSConfig:
    Origins: "*" # any origin, without credentials; list origins (comma-separated) to allow cookies
    Methods: "GET, POST, PUT, DELETE, OPTIONS"
    Headers: "Content-Type, Authorization"

Services:
  starwars:
    URL: "https://swapi.dev"
    Subpath: "/api"
    Plugins:
      - "logger"
      - "cors"
      - "rate-limit"
      - "cache"
    Endpoints:
      - Name: "List People"
        HTTPMethod: "GET"
        Path: "/people"

      - Name: "Get Person"
        HTTPMethod: "GET"
        Path: "/people/{id}"

      - Name: "List Starships"
        HTTPMethod: "GET"
        Path: "/starships"

      - Name: "Get Starship"
        HTTPMethod: "GET"
        Path: "/starships/{id}"

  someotherserver:
    URL: "http://localhost:3001"
    Subpath: "/api"
    Plugins:
      - "logger"
    Endpoints:
      - Name: "List Worlds"
        HTTPMethod: "GET"
        Path: "/worlds"

      - Name: "Create World"
        HTTPMethod: "POST"
        Path: "/worlds"

      - Name: "Get World"
        HTTPMethod: "GET"
        Path: "/worlds/{id}"
