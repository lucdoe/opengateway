# Server and Store can be left out; the values below are the defaults.
# Environment variables override this file: PORT, STORE_TYPE, REDIS_HOST,
# REDIS_PORT, REDIS_PASSWORD and JWT_SECRET (for Plugins.JWTConfig.SecretKey).
Server:
  Port: 4000
  ReadHeaderTimeout: 10s # time a client has to send its request headers
  IdleTimeout: 120s # how long an idle keep-alive connection stays open
  ShutdownTimeout: 15s # time requests in flight get to finish on shutdown
  UpstreamTimeout: 30s # time an upstream has to start answering

# Where the cache and rate-limit plugins keep their state.
Store:
  Type: "memory" # memory: in the gateway, per instance. redis: shared by all instances
  Redis: # only read when Type is redis; needs Redis 7.0+ or a compatible server
    Host: "localhost"
    Port: 6379
    Password: ""

Plugins:
  LoggerConfig:
    FilePath: "server.log"
    ErrOutput: "stderr"
  JWTConfig:
    SecretKey: "your-256-bit-secret"
    SigningMethod: "HS256"
    Issuer: "ExampleIssuer"
    Audience: "ExampleAudience"
    Scope: "ExampleScope"
  RateLimitConfig:
    Limit: 100
    Window: 1m
  CORSConfig:
    Origins: "*"
    Methods: "GET, POST, PUT, DELETE, OPTIONS"
    Headers: "Content-Type, Authorization"

Services:
  starwars:
    URL: "https://swapi.dev"
    Subpath: "/api"
    Protocol: "HTTP"
    Plugins:
      - "logger"
      - "cors"
      - "rate-limit"
      - "cache"
    Endpoints:
      - Name: "List People"
        HTTPMethod: "GET"
        Path: "/people"
        QueryParams:
          - Key: "page"
            Value: "1"
        Auth:
          ApplyAuth: false

      - Name: "Get Person"
        HTTPMethod: "GET"
        Path: "/people/{id}"
        Auth:
          ApplyAuth: false

      - Name: "List Starships"
        HTTPMethod: "GET"
        Path: "/starships"
        QueryParams:
          - Key: "page"
            Value: "1"
        Auth:
          ApplyAuth: false

      - Name: "Get Starship"
        HTTPMethod: "GET"
        Path: "/starships/{id}"
        Auth:
          ApplyAuth: false

  someotherserver:
    URL: "http://localhost:3001"
    Subpath: "/api"
    Protocol: "HTTP"
    Plugins:
      - "logger"
    Endpoints:
      - Name: "List People"
        HTTPMethod: "GET"
        Path: "/worlds"
        QueryParams:
          - Key: "page"
            Value: "1"
        Auth:
          ApplyAuth: false

      - Name: "List People"
        HTTPMethod: "POST"
        Path: "/worlds"
        QueryParams:
          - Key: "page"
            Value: "1"
        Auth:
          ApplyAuth: false

      - Name: "Get Person"
        HTTPMethod: "GET"
        Path: "/worlds/{id}"
        Auth:
          ApplyAuth: false
