services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - '4000:4000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/__health']
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - STORE_TYPE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  redis_data:
